name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 3. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # 4. Check Web Files
      # ==========================================
      - name: Check Web Files
        run: |
          echo "===== WEB FILES ====="
          find www -maxdepth 3 -type f | sort

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

          echo "OK: www/index.html found"


      # ==========================================
      # 5. Check App Icon
      # ==========================================
      - name: Check App Icon
        run: |
          if [ ! -f "assets/mknote-icon.png" ]; then
            echo "ERROR: assets/mknote-icon.png not found!"
            exit 1
          fi

          echo "OK: assets/mknote-icon.png found"


      # ==========================================
      # 6. Create package.json
      # ==========================================
      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi


      # ==========================================
      # 7. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android


      # ==========================================
      # 8. Initialize Capacitor
      # ==========================================
      - name: Initialize Capacitor
        run: |
          npx cap init "MK Call" "com.mk.call" --web-dir www


      # ==========================================
      # 9. Add Android Platform
      # ==========================================
      - name: Add Android Platform
        run: |
          npx cap add android


      # ==========================================
      # 10. Fix Kotlin Dependency Conflict
      # ==========================================
      - name: Fix Kotlin Dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

          echo "OK: Kotlin dependency resolution added"


      # ==========================================
      # 11. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ==========================================
      # 12. Clean Android Build
      # ==========================================
      - name: Clean Android Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean


      # ==========================================
      # 13. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # ==========================================
      # 14. Check APK
      # ==========================================
      - name: Check APK
        run: |
          echo "===== APK FILES ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "OK: APK successfully created!"


      # ==========================================
      # 15. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-Call-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
